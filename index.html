<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/Barylie/manifest.json" />
  <link rel="stylesheet" href="/Barylie/style.css" />
  <title>Inventario Almacén PWA</title>
</head>
<body>
  <header>
    <h1>Barylie Shop</h1>
    <nav id="nav">
      <button onclick="activarPantallaAdd()">➕ Añadir</button>
      <button onclick="activarPantallaSearch()">🔍 Busqueda</button>
      <button onclick="mostrarPantallaMovimientos()">📥 Entrada / 📤 Salida</button>
      <div class="dropdown-backup">
        <button class="dropdown-toggle">📁 Copia de seguridad</button>
        <div class="dropdown-menu hidden">
          <button onclick="exportarBackup()">🗂️ Exportar</button>
          <label class="import-label">📥 Importar
            <input type="file" accept=".json" onchange="confirmarImportacion(event)" hidden>

          </label>
        </div>
      </div>
      
      <button onclick="mostrarPantallaHistorialConFiltro()">📋 Registros</button>
    </nav>
  </header>
  

  <main>
    <!-- Pantalla Añadir Producto -->
    <section id="addScreen" class="screen hidden">
      <h2 id="tituloFormulario">Añadir Producto</h2>
      <form id="productForm">
        <input type="hidden" id="productIndex" />

        <div class="fila-doble">
          <label>Código:
            <input type="text" id="codigo" />
            <button type="button" onclick="generarCodigoAutomatico8()">🎲 Generar</button>
            <div id="reader" style="display:none;"></div>
            <p id="result"></p>
          </label>
          <label>Referencia:
            <input type="text" id="referencia" />
          </label>
        </div>

        <label class="etiqueta-zona">Zona:
          <input type="text" id="zona">
        </label>

        <div class="fila-doble">
          <label>Nombre:
            <input type="text" id="nombre" required />
          </label>
          <label>Proveedor:
            <input type="text" id="proveedor" />
          </label>
        </div>

        <label for="categoria">Categoría:</label>
        <div class="cat">
          <div class="cat1">
            <div class="categoria-contenedor">
              <select id="categoria"></select>
              <button type="button" onclick="eliminarCategoriaSeleccionada()" title="Eliminar categoría seleccionada">🗑️</button>
            </div>
          </div>
          <div class="cat2">
            <input type="text" id="nuevaCategoria" placeholder="Nueva categoría" />
            <button type="button" onclick="addCategoria()">Añadir Categoría</button>
          </div>
        </div>

        <div class="fotos-row">
          <div>
            <label>Foto 1:
              <label class="custom-file">
                <span class="custom-file-label">Producto</span>
                <input type="file" accept="image/*" onchange="previewImage(this, 1)" class="boton-foto" />
              </label>
              <img id="preview1" style="max-height: 100px; display: block; margin-top: 5px;" />
            </label>
          </div>
          <div>
            <label>Foto 2:
              <label class="custom-file">
                <span class="custom-file-label">Embalaje</span>
                <input type="file" accept="image/*" onchange="previewImage(this, 2)" class="boton-foto" />
              </label>
              <img id="preview2" style="max-height: 100px; display: block; margin-top: 5px;" />
            </label>
          </div>
        </div>

        <label>Descripción:
          <textarea id="descripcion"></textarea>
        </label>

        <div class="fila-doble">
          <label>Piezas: <input type="number" step="any" id="cantidad" value="0" /></label>
          <label>N° Bultos: <input type="number" step="any" id="cajas" value="0"/></label>
        </div>
        <div class="fila-doble">
          <label>Precio Original ($): <input type="number" step="any" id="precioOriginal" required value="0"/></label>
          <label>Tasa/Cambio (MN): <input type="number" step="any" id="tasa" value="0" /></label>
        </div>
        <div class="fila-doble">
          <label>Precio Costo (MN): <input type="number" step="any" id="precioCosto" required /></label>
          <label>Precio Venta (MN): <input type="number" step="any" id="precioVenta" required /></label>
        </div>
        <label>Existencia en Almacén:
          <input type="number" step="any" id="stock" required />
        </label>

        <div class="actions">
          <button type="submit">Guardar</button>
          <button type="button" class="cancelar" onclick="cancelarOperacion()">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Pantalla Buscar Producto -->
    <section id="searchScreen" class="screen hidden">
      
<select id="selectorBusqueda" onchange="productoDesdeBusquedaSeleccionado()"></select>
<button type="button" class="ver-info" onclick="verInfoProductoSeleccionado()">ℹ️ Ver Info</button>


  <h2>Buscar Producto</h2>

 
  <div class="barra-busqueda">
    <input type="text" id="buscarInput" placeholder="Código o nombre..." oninput="buscarProductos()" />
    <button class="btn-scan" onclick="scanCode(true)">🔍</button>
  </div>

  <button type="button" class="cancelar" onclick="cancelarOperacion()">Cancelar</button>

  <div id="resultados"></div>
</section>


    <div id="modalImagen" class="modal hidden">
      <span class="cerrar-modal" onclick="cerrarModal()">✖️</span>
      <img id="imagenAmpliada" src="" alt="Vista ampliada">
    </div>

    <!-- Pantalla Movimiento -->
    <section id="movimientoScreen" class="screen hidden">
      <h2>🔄 Registrar Movimiento</h2>
      <div id="popupMovimiento" class="popup hidden"></div>
      <form id="formMovimiento" onsubmit="registrarMovimientoDesdeFormulario(event)">
        <label for="productoMovimiento">Producto:</label>
        <label>Total de productos: <strong id="totalProductos">--</strong></label>

        <input type="text" id="buscarProductoMovimiento" placeholder="Buscar producto por código, nombre o referencia">
        <select id="productoMovimiento" required></select>
        <img id="previewMovimiento" src="" alt="Foto producto" style="max-width: 150px; max-height: 150px; margin: 10px 0;">
        <p>📦 Stock actual: <strong id="stockActual">--</strong></p>
        <button type="button" onclick="verInfoProductoSeleccionado()">ℹ️ Ver Info Producto</button>
        <label for="tipoMovimiento">Tipo:</label>
        <select id="tipoMovimiento" required>
          <option value="entrada">➕ Entrada</option>
          <option value="salida">➖ Salida</option>
        </select>
        <label for="cantidadMovimiento">Cantidad:</label>
        <input type="number" id="cantidadMovimiento" min="1" required>
        <label for="notaMovimiento">Nota (opcional):</label>
        <input type="text" id="notaMovimiento" placeholder="Proveedor, motivo, etc.">
        <button type="submit">Registrar Movimiento</button>
        <button type="button" onclick="cancelarOperacion()">Cancelar</button>
      </form>
    </section>

    <!-- Pantalla Historial Filtrado -->
    <section id="historialFiltradoScreen" class="screen hidden">
      <h2>📋 Historial de Movimientos</h2>
      
     <div>
  <label>Tipo:
    <select id="filtroTipo">
      <option value="">Todos</option>
      <option value="entrada">Entrada</option>
      <option value="salida">Salida</option>
    </select>
  </label>

  <label>Fecha:
    <input type="date" id="filtroFecha">
  </label>

  <label>Nombre:
    <input type="text" id="filtroNombre" placeholder="Nombre o letra...">
  </label>

  <button onclick="aplicarFiltroHistorial()">🔎 Aplicar Filtro</button>
  <button onclick="cancelarOperacion()">Cancelar</button>
</div>

      <div id="resultadosFiltrados"></div>
    </section>
  </main>

  <div id="popupMovimiento" class="popup hidden"></div>
  

<script src="/Barylie/app.js" defer></script>
<script src="/Barylie/movimientos.js" defer></script>
<script src="/Barylie/historial.js" defer></script>
  
  <script>
    function previewImage(input, index) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById(`preview${index}`).src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
   
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/Barylie/sw.js', { scope: '/Barylie/' })
      .then(reg => {
        console.log('SW registrado', reg);

        reg.onupdatefound = () => {
          const nuevoSW = reg.installing;
          nuevoSW.onstatechange = () => {
            if (nuevoSW.state === 'installed' && navigator.serviceWorker.controller) {
              alert("🔁 Nueva versión disponible. Recargando...");
              location.reload();
            }
          };
        };
      })
      .catch(err => {
        console.error('Error al registrar SW:', err);
      });
  }
  function generarCodigoAutomatico8() {
  const codigo = Math.floor(10000000 + Math.random() * 90000000); // número aleatorio de 8 dígitos
  document.getElementById('codigo').value = codigo;
}

</script>

</body>
</html>
